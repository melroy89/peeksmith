app-id: org.melroy.Peeksmith
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
branch: main
command: peeksmith
finish-args:
  - --share=ipc
  - --socket=x11
  - --env=GDK_BACKEND=x11
  - --socket=wayland
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.gnome.Shell
  - --talk-name=org.gnome.Shell.Screencast
  - --filesystem=home
  - --filesystem=xdg-videos
  - --metadata=X-DConf=migrate-path=/org/melroy/Peeksmith/
  - --env=LD_LIBRARY_PATH=/app/lib
build-options:
  cflags: -O2 -g -fstack-protector-strong -D_FORTIFY_SOURCE=2
  cxxflags: -O2 -g -fstack-protector-strong -D_FORTIFY_SOURCE=2
  ldflags: -fstack-protector-strong -Wl,-z,relro,-z,now
  append-path: /usr/lib/sdk/rust-stable/bin
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gtk-doc
  - "*.la"

modules:
  - name: ffmpeg
    config-opts:
      - --disable-debug
      - --disable-static
      - --enable-gpl
      - --enable-libvpx
      - --enable-libx264
      - --enable-shared
      - --enable-libxcb
      - --enable-libxcb-xfixes
      - --disable-libxcb-shape
      - --disable-ffplay
      - --disable-ffprobe
      - --disable-doc
      - --disable-everything
      - --enable-bsf=vp9_superframe
      - --enable-decoder=h264
      - --enable-decoder=libvpx_vp9
      - --enable-decoder=png
      - --enable-decoder=rawvideo
      - --enable-encoder=apng
      - --enable-encoder=ffvhuff
      - --enable-encoder=gif
      - --enable-encoder=libvpx_vp9
      - --enable-encoder=libx264
      - --enable-encoder=libx264rgb
      - --enable-encoder=png
      - --enable-demuxer=image2
      - --enable-demuxer=matroska
      - --enable-muxer=apng
      - --enable-muxer=gif
      - --enable-muxer=image2
      - --enable-muxer=mp4
      - --enable-muxer=matroska
      - --enable-muxer=webm
      - --enable-filter=crop
      - --enable-filter=fps
      - --enable-filter=palettegen
      - --enable-filter=paletteuse
      - --enable-filter=scale
      - --enable-protocol=file
      - --enable-indev=xcbgrab
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
        sha256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e
    modules:
      - name: nasm
        cleanup:
          - "*"
        sources:
          - type: archive
            url: https://www.nasm.us/pub/nasm/releasebuilds/3.02/nasm-3.02.tar.xz
            sha256: 87336eba53b4acfe917424ab5d500d2b0054d9f5148d35c2273ccf2cfb712f0d
      - name: libx264
        config-opts:
          - --enable-pic
          - --enable-shared
        sources:
          - type: git
            url: https://code.videolan.org/videolan/x264.git
            commit: b35605ace3ddf7c1a5d67a2eb553f034aef41d55
        cleanup:
          - /bin/x264

  - name: gifski
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    skip-arches:
      - aarch64
      - arm
    sources:
      - type: archive
        url: https://codeload.github.com/ImageOptim/gifski/tar.gz/refs/tags/1.34.0
        sha256: c9711473615cb20d7754e8296621cdd95cc068cb04b640f391cd71f8787b692c
    build-commands:
      - cargo build --release --locked --verbose
      - install -Dm755 target/release/gifski /app/bin/gifski

  - name: peeksmith
    buildsystem: meson
    config-opts:
      - --buildtype=release
    build-options:
      cflags: -L/app/lib
    sources:
      - type: git
        url: ../..
        branch: main
    modules:
      - name: keybinder3
        sources:
          - type: archive
            url: https://github.com/kupferlauncher/keybinder/releases/download/keybinder-3.0-v0.3.2/keybinder-3.0-0.3.2.tar.gz
            sha256: e6e3de4e1f3b201814a956ab8f16dfc8a262db1937ff1eee4d855365398c6020
