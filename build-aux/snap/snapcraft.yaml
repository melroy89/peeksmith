name: peeksmith
adopt-info: peeksmith
grade: stable
confinement: strict
base: core24

apps:
  peeksmith:
    command: usr/bin/peeksmith
    desktop: usr/share/applications/org.melroy.Peeksmith.desktop
    common-id: org.melroy.Peeksmith.desktop
    extensions: [gnome]
    plugs:
      - gsettings
      - home
  ffmpeg:
    command: usr/bin/ffmpeg

slots:
  session-dbus-interface:
    interface: dbus
    name: org.melroy.Peeksmith
    bus: session

parts:
  peeksmith:
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Dbuild-tests=false
      - -Denable-filechoosernative=false
      - -Denable-gnome-shell=false
      - -Denable-open-file-manager=false
    source: .
    source-type: git
    parse-info: [usr/share/metainfo/org.melroy.Peeksmith.appdata.xml]
    build-packages:
      - libgtk-3-dev
      - libkeybinder-3.0-dev
      - gettext
      - valac
      - libxml2-utils
      - txt2man
    stage-packages:
      - libcanberra-gtk3-module
      - libkeybinder-3.0-0
    override-pull: |
      craftctl default
      sed -i.bak -e 's|Icon=org.melroy.Peeksmith$|Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/org.melroy.Peeksmith.svg|g' data/org.melroy.Peeksmith.desktop.in
    prime:
      - -usr/lib/pkgconfig
      - -usr/lib/*-linux-*/dri
      - -usr/lib/*-linux-*/libasound*
      - -usr/lib/*-linux-*/libgnutls*
      - -usr/lib/*-linux-*/libicu*
      - -usr/lib/*-linux-*/libLLVM*
      - -usr/lib/*-linux-*/libX11*
      - -usr/share/alsa
      - -usr/share/bug
      - -usr/share/doc
      - -usr/share/fonts
      - -usr/share/man
      - -usr/share/mime
      - -usr/share/libthai
      - -usr/share/lintian
      - -usr/share/pkgconfig
      - -usr/share/sounds
      - -usr/share/X11

  ffmpeg:
    plugin: autotools
    source: https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
    source-checksum: sha256/8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e
    autotools-configure-parameters:
      - --prefix=/usr
      - --disable-debug
      - --disable-static
      - --enable-gpl
      - --enable-libvpx
      - --enable-libx264
      - --enable-shared
      - --enable-libxcb
      - --enable-libxcb-xfixes
      - --disable-libxcb-shape
      - --disable-ffplay
      - --disable-ffprobe
      - --disable-doc
      - --disable-everything
      - --enable-bsf=vp9_superframe
      - --enable-decoder=h264
      - --enable-decoder=libvpx_vp9
      - --enable-decoder=png
      - --enable-decoder=rawvideo
      - --enable-encoder=apng
      - --enable-encoder=ffvhuff
      - --enable-encoder=gif
      - --enable-encoder=libvpx_vp9
      - --enable-encoder=libx264
      - --enable-encoder=libx264rgb
      - --enable-encoder=png
      - --enable-demuxer=image2
      - --enable-demuxer=matroska
      - --enable-muxer=apng
      - --enable-muxer=gif
      - --enable-muxer=image2
      - --enable-muxer=mp4
      - --enable-muxer=matroska
      - --enable-muxer=webm
      - --enable-filter=crop
      - --enable-filter=fps
      - --enable-filter=palettegen
      - --enable-filter=paletteuse
      - --enable-filter=scale
      - --enable-protocol=file
      - --enable-indev=xcbgrab
    build-packages:
      - libx264-dev
      - libvpx-dev
      - nasm
      - libxcb1-dev
      - libxcb-xfixes0-dev
    stage-packages:
      - libx264-164
      - libvpx9
      - libxcb-xfixes0
    prime:
      - -usr/include
      - -usr/lib/pkgconfig
      - -usr/share/applications
      - -usr/share/bug
      - -usr/share/doc
      - -usr/share/fonts
      - -usr/share/ffmpeg/examples
      - -usr/share/icons
      - -usr/share/locale
      - -usr/share/man
